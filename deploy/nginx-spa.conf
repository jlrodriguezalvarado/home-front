server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
  gzip_min_length 256;
  # Angular service worker — never cache (required for PWA updates)
  location ~* ^/(sw\.js|ngsw-worker\.js|ngsw\.json|safety-worker\.js)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
  # Hashed static assets — long cache (Angular outputHashing: all)
  location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # SPA fallback — all client routes serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
