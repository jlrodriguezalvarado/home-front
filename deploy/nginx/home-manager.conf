# Home Manager — Angular PWA + API reverse proxy
# Copy to /etc/nginx/sites-available/ and adjust paths, domains, and upstream.

upstream home_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name home.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name home.example.com;
    root /var/www/home-manager;
    index index.html;
    # ssl_certificate     /etc/letsencrypt/live/home.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/home.example.com/privkey.pem;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 256;
    # Angular service worker — never cache (required for PWA updates)
    location ~* ^/(sw\.js|ngsw-worker\.js|ngsw\.json|safety-worker\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }
    # Backend API (same origin — avoids CORS)
    location /api/ {
        proxy_pass http://home_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
    # Django/media files
    location /media/ {
        proxy_pass http://home_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Hashed static assets — long cache (Angular outputHashing: all)
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # SPA fallback — all client routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
