<div class="relative">
  <button
    type="button"
    data-search-select-trigger
    (click)="toggle()"
    class="input-outlined flex min-h-[44px] w-full items-center justify-between gap-sm text-left"
  >
    <span class="truncate" [class.text-on-surface-variant]="!value">{{
      selectedLabel() || placeholder
    }}</span>
    <span class="material-symbols-outlined shrink-0 text-on-surface-variant">{{
      open() ? 'expand_less' : 'expand_more'
    }}</span>
  </button>
  @if (clearable && value && !open()) {
    <button
      type="button"
      (click)="clear($event)"
      class="absolute right-10 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface"
    >
      <span class="material-symbols-outlined text-[18px]">close</span>
    </button>
  }
</div>
@if (open()) {
  <div class="fixed inset-0 z-[60]" (click)="close()"></div>
}
@if (open() && panelStyle(); as panel) {
  <div
    class="search-select-panel fixed z-[70] flex flex-col overflow-hidden rounded-xl border border-outline-variant bg-surface-container-lowest shadow-card-hover"
    [style.top]="panel.top"
    [style.left]="panel.left"
    [style.width]="panel.width"
    [style.max-height]="panel.maxHeight"
    (click)="$event.stopPropagation()"
  >
    <div class="shrink-0 border-b border-outline-variant p-sm">
      <div class="relative">
        <span
          class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[18px] text-on-surface-variant"
          >search</span
        >
        <input
          type="search"
          [ngModel]="searchQuery()"
          (ngModelChange)="onSearchInput($event)"
          [placeholder]="searchPlaceholder"
          class="input-outlined w-full py-2 pl-10"
        />
      </div>
    </div>
    <div class="min-h-0 flex-1 overflow-y-auto">
      @if (clearable) {
        <button
          type="button"
          (click)="valueChange.emit(null); close()"
          class="w-full px-md py-sm text-left text-body-md text-on-surface-variant transition-colors hover:bg-surface-container-high"
        >
          —
        </button>
      }
      @if (loading) {
        <app-loading-state class="block p-md"></app-loading-state>
      }
      @if (!loading && filteredOptions().length === 0) {
        <p class="px-md py-sm text-body-md text-on-surface-variant">{{ emptyLabel }}</p>
      }
      @for (opt of filteredOptions(); track opt) {
        <button
          type="button"
          (click)="select(opt)"
          class="w-full truncate px-md py-sm text-left text-body-md text-on-surface transition-colors hover:bg-surface-container-high"
          [class.bg-primary-container]="opt.value === value"
          [class.text-on-primary-container]="opt.value === value"
        >
          {{ opt.label }}
        </button>
      }
    </div>
  </div>
}
