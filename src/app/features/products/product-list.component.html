

<div class="space-y-lg">

  <div class="flex flex-col gap-md">

    <h1 class="page-title">{{ i18n.t('products') }}</h1>

    <div class="relative w-full md:max-w-md md:ml-auto">

      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>

      <input type="text" [placeholder]="i18n.t('search')"

             [(ngModel)]="searchDraft" (ngModelChange)="onSearchChange($event)"

             class="input-outlined pl-10 py-2 w-full">

    </div>

  </div>



  <div class="flex flex-col md:flex-row gap-sm md:gap-md -mx-margin-mobile px-margin-mobile md:mx-0 md:px-0">

    <select [(ngModel)]="selectedCommerceId" (ngModelChange)="onCommerceChange($event)"

            class="input-outlined py-2 px-md w-full md:w-auto md:min-w-[140px]">

      <option *ngFor="let c of commerces()" [value]="c.id">{{ c.name }}</option>

    </select>



    <select [(ngModel)]="selectedCategoryId" (ngModelChange)="onCategoryChange($event)"

            class="input-outlined py-2 px-md w-full md:w-auto md:min-w-[140px]">

      <option [ngValue]="null">{{ i18n.t('category') }} — {{ allCategoriesLabel }}</option>

      <option *ngFor="let cat of categories()" [ngValue]="cat.id">{{ cat.name }}</option>

    </select>

  </div>



  <app-loading-state *ngIf="loading() && products().length === 0"></app-loading-state>

  <app-error-state *ngIf="error()" (retry)="reloadProducts()"></app-error-state>

  <app-empty-state *ngIf="!loading() && !error() && products().length === 0" icon="inventory_2"></app-empty-state>



  <div *ngIf="products().length > 0" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-sm md:gap-md">

    <div *ngFor="let product of products()"

         class="card-surface overflow-hidden flex flex-col hover:shadow-card-hover transition-shadow group h-full">

      <div class="aspect-square bg-white dark:bg-surface-container-lowest relative overflow-hidden">

        <img *ngIf="product.imageUrl"

             [src]="product.imageUrl"

             [alt]="product.name"

             class="w-full h-full object-contain p-2 md:p-3"

             loading="lazy">

        <div *ngIf="!product.imageUrl" class="w-full h-full flex items-center justify-center bg-surface-container text-on-surface-variant">

          <span class="material-symbols-outlined text-[32px]">image</span>

        </div>

      </div>

      <div class="p-sm md:p-md flex-1 flex flex-col gap-xs min-h-0">

        <p class="text-label-md text-on-surface-variant truncate">{{ commerceName(product.commerceId) }}</p>

        <h3 class="text-label-md md:text-label-lg text-on-surface line-clamp-2 leading-snug min-h-[2.5rem]">

          {{ product.name }}

        </h3>

        <div class="mt-auto pt-sm space-y-sm">

          <p class="text-primary text-numeral-md tabular-nums font-semibold leading-tight">

            {{ unitPriceLabel(product) }}

          </p>

          <div class="flex justify-end">

            @if (qtyInCart(product.id) <= 0) {

              <button (click)="addToCart(product)"

                      class="w-9 h-9 flex items-center justify-center bg-primary text-on-primary rounded-full hover:opacity-90 transition-opacity shadow-card"

                      [attr.aria-label]="i18n.t('addToCart')">

                <span class="material-symbols-outlined text-[20px]">add_shopping_cart</span>

              </button>

            } @else {

              <app-quantity-editor

                [product]="product"

                [quantity]="qtyInCart(product.id)"

                [compact]="true"

                (setQuantity)="onSetQuantity(product.id, $event)"

              />

            }

          </div>

        </div>

      </div>

    </div>

  </div>



  <div *ngIf="hasMore()" class="flex justify-center py-lg">

    <button (click)="loadMore()" [disabled]="loading()"

            class="px-lg py-2 bg-surface-container text-on-surface rounded-xl hover:bg-surface-container-high transition-colors text-label-lg">

      {{ loading() ? '...' : i18n.t('loadMore') }}

    </button>

  </div>

</div>
