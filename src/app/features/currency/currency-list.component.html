<div class="space-y-lg">
  <div class="flex items-center justify-between">
    <h1 class="page-title">{{ i18n.t('currencies') }}</h1>
    <button (click)="openDialog()" class="btn-primary flex items-center gap-2">
      <span class="material-symbols-outlined text-[20px]">add</span>
      Add Currency
    </button>
  </div>

  <div class="grid grid-cols-1 gap-md md:grid-cols-2 lg:grid-cols-3">
    @for (c of currencies(); track c) {
      <div class="card-surface p-lg transition-shadow hover:shadow-card-hover">
        <div class="flex items-start justify-between">
          <div>
            <div class="text-headline-md tabular-nums text-on-surface">{{ c.code }}</div>
            <div class="text-body-md text-on-surface-variant">{{ c.name }}</div>
          </div>
          <div class="text-right">
            <div class="text-headline-md text-primary">{{ c.symbol }}</div>
            <div class="mt-md flex gap-sm">
              <button (click)="openDialog(c)" class="text-label-md text-primary hover:underline">
                Edit
              </button>
              <button (click)="deleteCurrency(c)" class="text-label-md text-error hover:underline">
                {{ i18n.t('delete') }}
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>

  @if (showDialog) {
    <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-md" (appDialogEscape)="closeDialog()">
      <div
        class="w-full max-w-md rounded-[24px] border border-outline-variant bg-surface-container-lowest p-xl shadow-card-hover"
      >
        <h2 class="mb-lg text-title-lg text-on-surface">
          {{ editingId ? 'Edit' : 'Add' }} Currency
        </h2>
        <div class="space-y-md" appDialogForm (dialogSubmit)="save()">
          <div>
            <label class="mb-xs block text-label-lg text-on-surface-variant">Code</label>
            <input
              type="text"
              [(ngModel)]="form.code"
              [disabled]="!!editingId"
              class="input-outlined uppercase"
            />
          </div>
          <div>
            <label class="mb-xs block text-label-lg text-on-surface-variant">Name</label>
            <input type="text" [(ngModel)]="form.name" class="input-outlined" />
          </div>
          <div>
            <label class="mb-xs block text-label-lg text-on-surface-variant">Symbol</label>
            <input type="text" [(ngModel)]="form.symbol" class="input-outlined" />
          </div>
          <div class="flex gap-md pt-md">
            <button
              (click)="closeDialog()"
              class="flex-1 rounded-xl border border-outline-variant py-3 text-label-lg"
            >
              {{ i18n.t('cancel') }}
            </button>
            <button (click)="save()" class="btn-primary flex-1 py-3">{{ i18n.t('save') }}</button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
