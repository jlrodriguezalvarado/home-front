<div
  class="relative flex h-full items-center justify-center overflow-hidden bg-background p-md text-on-surface"
>
  <div class="emerald-pattern pointer-events-none absolute inset-0"></div>

  <div class="absolute right-margin-mobile top-md z-50 flex gap-2 md:right-lg md:top-lg">
    <button
      (click)="toggleLang()"
      class="flex items-center gap-2 rounded-full border border-outline-variant bg-surface-container-lowest px-md py-sm shadow-card transition-colors hover:bg-surface-container"
    >
      <span class="material-symbols-outlined text-[18px] text-primary">language</span>
      <span class="text-label-md uppercase text-on-surface-variant">{{ i18n.lang() }}</span>
    </button>
    <button
      (click)="theme.toggleTheme()"
      class="flex items-center gap-2 rounded-full border border-outline-variant bg-surface-container-lowest px-md py-sm shadow-card transition-colors hover:bg-surface-container"
    >
      <span class="material-symbols-outlined text-[18px] text-primary">{{
        theme.isDark() ? 'light_mode' : 'dark_mode'
      }}</span>
    </button>
  </div>

  <main class="relative z-10 w-full max-w-[440px]">
    <div
      class="border-outline-variant/30 rounded-[24px] border bg-surface-container-lowest p-xl shadow-card md:p-xxl"
    >
      <div class="mb-xl flex flex-col items-center">
        <div
          class="mb-md flex h-16 w-16 items-center justify-center rounded-2xl bg-primary-container"
        >
          <span class="material-symbols-outlined text-[32px] text-on-primary">home</span>
        </div>
        <h1 class="text-center text-headline-md text-on-surface">{{ t('welcomeBack') }}</h1>
        <p class="mt-xs text-center text-body-md text-on-surface-variant">
          {{ t('loginSubtitle') }}
        </p>
      </div>

      <form (submit)="onSubmit()" class="space-y-lg">
        <div class="space-y-xs">
          <label class="ml-1 block text-label-lg text-on-surface-variant">{{ t('email') }}</label>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
              >mail</span
            >
            <input
              type="email"
              [(ngModel)]="email"
              name="email"
              required
              placeholder="name@company.com"
              class="input-outlined py-3 pl-12 pr-md"
            />
          </div>
        </div>

        <div class="space-y-xs">
          <div class="ml-1 flex items-center justify-between">
            <label class="text-label-lg text-on-surface-variant">{{ t('password') }}</label>
            <a class="cursor-pointer text-label-md text-primary hover:underline">{{
              t('forgotPassword')
            }}</a>
          </div>
          <div class="relative">
            <span
              class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline"
              >lock</span
            >
            <input
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              required
              placeholder="••••••••"
              class="input-outlined py-3 pl-12 pr-12"
            />
            <button
              type="button"
              (click)="showPassword = !showPassword"
              class="absolute inset-y-0 right-0 flex items-center pr-md text-outline-variant transition-colors hover:text-outline"
            >
              <span class="material-symbols-outlined">{{
                showPassword ? 'visibility_off' : 'visibility'
              }}</span>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-sm">
          <input
            type="checkbox"
            id="remember"
            [(ngModel)]="remember"
            name="remember"
            class="h-4 w-4 rounded border-outline-variant bg-surface-container-low text-primary focus:ring-primary"
          />
          <label for="remember" class="text-label-md text-on-surface-variant">{{
            t('rememberDevice')
          }}</label>
        </div>

        <button
          type="submit"
          [disabled]="loading"
          class="btn-primary flex w-full items-center justify-center gap-2 py-4 disabled:opacity-50"
        >
          <span>{{ loading ? '...' : t('login') }}</span>
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>

        @if (error) {
          <div class="bg-error-container/30 rounded-lg py-2 text-center text-body-md text-error">
            {{ error }}
          </div>
        }
      </form>
    </div>

    <footer class="mt-lg flex items-center justify-center gap-md text-outline-variant">
      <div class="flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">verified_user</span>
        <span class="text-label-md">{{ t('secureLogin') }}</span>
      </div>
      <div class="h-1 w-1 rounded-full bg-outline-variant"></div>
      <div class="flex items-center gap-1">
        <span class="material-symbols-outlined text-[16px]">lock_clock</span>
        <span class="text-label-md">256-bit AES</span>
      </div>
    </footer>
  </main>
</div>
