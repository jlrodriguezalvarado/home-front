<div class="space-y-sm">
  <div class="grid grid-cols-1 gap-sm sm:grid-cols-2 lg:grid-cols-4">
    @for (m of primaryMetrics; track m.id) {
      <app-finance-metric-card
        [metric]="m"
        [previousMonthExpenseEditable]="state.previousMonthExpenseEditable"
        [manualPreviousMonthExpense]="state.manualPreviousMonthExpense"
        [savingManualPreviousMonthExpense]="state.savingManualPreviousMonthExpense"
        [canSaveManualPreviousMonthExpense]="state.canSaveManualPreviousMonthExpense"
        [previousMonthRemainderEditable]="state.previousMonthRemainderEditable"
        [manualPreviousMonthRemainder]="state.manualPreviousMonthRemainder"
        [savingManualPreviousMonthRemainder]="state.savingManualPreviousMonthRemainder"
        [canSaveManualPreviousMonthRemainder]="state.canSaveManualPreviousMonthRemainder"
        [previousGlobalSavingsEditable]="state.previousGlobalSavingsEditable"
        [manualPreviousGlobalSavings]="state.manualPreviousGlobalSavings"
        [savingManualPreviousGlobalSavings]="state.savingManualPreviousGlobalSavings"
        [canSaveManualPreviousGlobalSavings]="state.canSaveManualPreviousGlobalSavings"
        (manualPreviousMonthExpenseChange)="manualPreviousMonthExpenseChange.emit($event)"
        (manualPreviousMonthRemainderChange)="manualPreviousMonthRemainderChange.emit($event)"
        (manualPreviousGlobalSavingsChange)="manualPreviousGlobalSavingsChange.emit($event)"
        (manageIncome)="manageIncome.emit()"
        (addIncome)="addIncome.emit()"
        (savePreviousMonthExpense)="savePreviousMonthExpense.emit()"
        (savePreviousMonthRemainder)="savePreviousMonthRemainder.emit()"
        (savePreviousGlobalSavings)="savePreviousGlobalSavings.emit()"
      />
    }
  </div>
  @if (secondaryMetrics.length > 0) {
    <div class="card-surface overflow-hidden">
      <button
        type="button"
        class="flex w-full items-center justify-between gap-md px-md py-sm text-left transition-colors hover:bg-surface-container"
        (click)="toggleDetails.emit()"
      >
        <div class="flex min-w-0 items-center gap-sm">
          <span class="material-symbols-outlined shrink-0 text-[20px] text-on-surface-variant">
            {{ summaryDetailsExpanded ? 'expand_less' : 'expand_more' }}
          </span>
          <span class="text-label-lg font-medium text-on-surface">{{ moreDetailsLabel }}</span>
        </div>
        <span class="text-label-sm shrink-0 tabular-nums text-on-surface-variant">{{
          secondaryMetrics.length
        }}</span>
      </button>
      @if (summaryDetailsExpanded) {
        <div class="grid grid-cols-2 gap-sm border-t border-outline-variant p-md pt-0 md:grid-cols-3">
          @for (m of secondaryMetrics; track m.id) {
            <app-finance-metric-card
              [metric]="m"
              [previousMonthExpenseEditable]="state.previousMonthExpenseEditable"
              [manualPreviousMonthExpense]="state.manualPreviousMonthExpense"
              [savingManualPreviousMonthExpense]="state.savingManualPreviousMonthExpense"
              [canSaveManualPreviousMonthExpense]="state.canSaveManualPreviousMonthExpense"
              [previousMonthRemainderEditable]="state.previousMonthRemainderEditable"
              [manualPreviousMonthRemainder]="state.manualPreviousMonthRemainder"
              [savingManualPreviousMonthRemainder]="state.savingManualPreviousMonthRemainder"
              [canSaveManualPreviousMonthRemainder]="state.canSaveManualPreviousMonthRemainder"
              [previousGlobalSavingsEditable]="state.previousGlobalSavingsEditable"
              [manualPreviousGlobalSavings]="state.manualPreviousGlobalSavings"
              [savingManualPreviousGlobalSavings]="state.savingManualPreviousGlobalSavings"
              [canSaveManualPreviousGlobalSavings]="state.canSaveManualPreviousGlobalSavings"
              (manualPreviousMonthExpenseChange)="manualPreviousMonthExpenseChange.emit($event)"
              (manualPreviousMonthRemainderChange)="manualPreviousMonthRemainderChange.emit($event)"
              (manualPreviousGlobalSavingsChange)="manualPreviousGlobalSavingsChange.emit($event)"
              (manageIncome)="manageIncome.emit()"
              (addIncome)="addIncome.emit()"
              (savePreviousMonthExpense)="savePreviousMonthExpense.emit()"
              (savePreviousMonthRemainder)="savePreviousMonthRemainder.emit()"
              (savePreviousGlobalSavings)="savePreviousGlobalSavings.emit()"
            />
          }
        </div>
      }
    </div>
  }
</div>
