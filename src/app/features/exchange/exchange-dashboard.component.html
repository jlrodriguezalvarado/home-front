<div class="space-y-lg">
  <h1 class="page-title">{{ i18n.t('exchangeRates') }}</h1>

  <div class="grid grid-cols-1 gap-lg md:grid-cols-2">
    <div class="card-surface p-lg">
      <h2 class="mb-md text-title-lg text-on-surface">Calculator</h2>
      <div class="space-y-md">
        <div>
          <label class="mb-xs block text-label-lg text-on-surface-variant">Amount</label>
          <input
            type="number"
            [(ngModel)]="amount"
            (ngModelChange)="calculate()"
            class="input-outlined"
          />
        </div>
        <div class="flex items-end gap-md">
          <div class="flex-1">
            <label class="mb-xs block text-label-lg text-on-surface-variant">From</label>
            <input
              type="text"
              [(ngModel)]="from"
              (ngModelChange)="calculate()"
              class="input-outlined uppercase"
            />
          </div>
          <button
            (click)="swap()"
            class="mb-1 rounded-full bg-surface-container p-2 transition-colors hover:bg-surface-container-high"
          >
            <span class="material-symbols-outlined">swap_horiz</span>
          </button>
          <div class="flex-1">
            <label class="mb-xs block text-label-lg text-on-surface-variant">To</label>
            <input
              type="text"
              [(ngModel)]="to"
              (ngModelChange)="calculate()"
              class="input-outlined uppercase"
            />
          </div>
        </div>
        <div class="bg-secondary-container/30 rounded-xl p-lg text-center">
          <div class="mb-xs text-label-md text-on-secondary-container">Result</div>
          <div class="text-display-lg tabular-nums text-primary">{{ result() }}</div>
        </div>

        <div class="space-y-md pt-md">
          <div>
            <label class="mb-xs block text-label-lg text-on-surface-variant">Notes</label>
            <textarea [(ngModel)]="notes" class="input-outlined" rows="2"></textarea>
          </div>
          <button
            (click)="saveExchange()"
            [disabled]="!canSave()"
            class="btn-primary w-full disabled:opacity-50"
          >
            Save Exchange
          </button>
        </div>
      </div>
    </div>

    <div class="card-surface p-lg">
      <h2 class="mb-md text-title-lg text-on-surface">Latest Rates</h2>
      <div class="divide-y divide-outline-variant">
        @for (rate of rates(); track rate) {
          <div class="flex items-center justify-between py-md">
            <div class="text-label-lg text-on-surface">
              <span>{{ rate.from_currency }}</span>
              <span class="mx-2 text-on-surface-variant">→</span>
              <span>{{ rate.to_currency }}</span>
            </div>
            <span class="text-numeral-md font-semibold tabular-nums text-primary">{{
              rate.rate
            }}</span>
          </div>
        }
        @if (rates().length === 0) {
          <div class="py-xl text-center text-body-md text-on-surface-variant">No rates found</div>
        }
      </div>
    </div>
  </div>
</div>
