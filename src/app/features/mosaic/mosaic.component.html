<div class="space-y-lg">
  <h1 class="page-title">{{ i18n.t('instagramTool') }}</h1>

  <div class="flex flex-col-reverse gap-lg md:flex-row">
    <div class="w-full shrink-0 space-y-md md:w-72">
      <div class="card-surface p-lg">
        <label class="btn-primary block w-full cursor-pointer py-3 text-center">
          <span class="material-symbols-outlined mr-1 align-middle text-[18px]">upload</span>
          Upload Image
          <input type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden" />
        </label>

        <div class="mt-lg space-y-md">
          <p class="text-label-lg text-on-surface-variant">Grid Presets</p>
          <div class="grid grid-cols-2 gap-sm">
            @for (p of presets; track p) {
              <button
                (click)="setPreset(p.rows, p.cols)"
                [class.bg-primary]="rows() === p.rows && cols() === p.cols"
                [class.text-on-primary]="rows() === p.rows && cols() === p.cols"
                class="rounded-xl border border-outline-variant p-2 text-label-md transition-colors hover:bg-surface-container"
              >
                {{ p.rows }}x{{ p.cols }}
              </button>
            }
          </div>
        </div>

        @if (imageSrc()) {
          <button
            (click)="generateTiles()"
            [disabled]="generating()"
            class="mt-lg w-full rounded-xl border-2 border-primary py-3 text-label-lg font-semibold text-primary transition-colors hover:bg-primary hover:text-on-primary disabled:opacity-50"
          >
            {{ generating() ? '...' : 'Download ZIP' }}
          </button>
        }
      </div>
    </div>

    <div
      class="relative flex min-h-[280px] flex-1 items-center justify-center overflow-hidden rounded-xl border border-dashed border-outline-variant bg-surface-container p-md md:min-h-[400px] md:p-xl"
    >
      @if (!imageSrc()) {
        <div class="flex flex-col items-center gap-sm text-body-md text-on-surface-variant">
          <span class="material-symbols-outlined text-[48px]">image</span>
          No image selected
        </div>
      }

      @if (imageSrc()) {
        <div
          class="border-primary/30 relative overflow-hidden rounded-lg border-4 border-dashed"
          [style.width.px]="previewWidth"
          [style.height.px]="previewHeight"
        >
          <img [src]="imageSrc()" class="h-full w-full object-cover opacity-50" />
          <div
            class="absolute inset-0 grid"
            [style.gridTemplateRows]="'repeat(' + rows() + ', 1fr)'"
            [style.gridTemplateColumns]="'repeat(' + cols() + ', 1fr)'"
          >
            @for (i of gridArray(); track i) {
              <div class="bg-primary/10 border border-white/50"></div>
            }
          </div>
        </div>
      }
    </div>
  </div>

  <canvas #canvas class="hidden"></canvas>
</div>
