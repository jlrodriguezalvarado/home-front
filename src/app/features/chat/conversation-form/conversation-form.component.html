<div class="min-h-0 flex-1 space-y-md overflow-y-auto">
  <label class="flex items-center gap-sm text-body-md text-on-surface">
    <input type="checkbox" [ngModel]="isGroup()" (ngModelChange)="onIsGroupChange($event)" />
    {{ i18n.t('groupConversation') }}
  </label>
  @if (isGroup()) {
    <div>
      <label class="mb-xs block text-label-lg text-on-surface-variant">{{ i18n.t('name') }}</label>
      <input
        type="text"
        [ngModel]="title()"
        (ngModelChange)="title.set($event)"
        class="input-outlined"
      />
    </div>
  }
  <div>
    <label class="mb-xs block text-label-lg text-on-surface-variant">{{
      i18n.t('participants')
    }}</label>
    <app-search-select
      [options]="userOptions()"
      [value]="null"
      [placeholder]="i18n.t('selectUser')"
      [searchPlaceholder]="i18n.t('search')"
      [emptyLabel]="i18n.t('noUsers')"
      [loading]="usersLoading()"
      (valueChange)="onUserSelected($event)"
      (searchChange)="onUserSearchChange($event)"
    >
    </app-search-select>
    @if (usersLoading() && users().length === 0) {
      <app-loading-state class="mt-sm block"></app-loading-state>
    }
    @if (selectedParticipants().length > 0) {
      <div class="mt-sm flex flex-wrap gap-sm">
        @for (participant of selectedParticipants(); track participant) {
          <span
            class="inline-flex items-center gap-1 rounded-lg bg-surface-container px-sm py-xs text-label-md text-on-surface"
          >
            {{ formatUserLabel(participant) }}
            <button
              type="button"
              (click)="removeParticipant(participant.id)"
              class="text-on-surface-variant hover:text-error"
            >
              <span class="material-symbols-outlined text-[16px]">close</span>
            </button>
          </span>
        }
      </div>
    }
    <p class="mt-sm text-body-md text-on-surface-variant">
      {{ isGroup() ? i18n.t('groupConversation') : i18n.t('directConversation') }}
    </p>
  </div>
  <div class="flex gap-md pt-md">
    <button
      type="button"
      (click)="cancel()"
      class="flex-1 rounded-xl border border-outline-variant py-3 text-label-lg"
    >
      {{ i18n.t('cancel') }}
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="saving()"
      class="btn-primary flex-1 py-3 disabled:opacity-50"
    >
      {{ i18n.t('createConversation') }}
    </button>
  </div>
</div>
