<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-md" (click)="close()">
  <div
    class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-[24px] border border-outline-variant bg-surface-container-lowest p-xl shadow-card-hover"
    (click)="$event.stopPropagation()"
  >
    <h2 class="mb-lg text-title-lg text-on-surface">{{ i18n.t('copyFavoriteMeal') }}</h2>
    @if (loading()) {
      <app-loading-state></app-loading-state>
    }
    @if (error()) {
      <app-error-state (retry)="load()"></app-error-state>
    }
    @if (!loading() && !error() && meals().length === 0) {
      <app-empty-state icon="favorite" [title]="i18n.t('favorites')"></app-empty-state>
    }
    @if (!loading() && !error() && meals().length > 0) {
      <div class="space-y-sm">
        @for (meal of meals(); track meal) {
          <button
            (click)="selectMeal(meal)"
            type="button"
            class="card-surface w-full p-md text-left transition-shadow hover:shadow-card-hover"
          >
            <div class="text-headline-md text-on-surface">{{ meal.mealType.name }}</div>
            <div class="text-body-md text-on-surface-variant">
              {{ meal.recipe?.name || meal.name }}
            </div>
            @if (meal.notes) {
              <div class="mt-xs text-body-md text-on-surface-variant">{{ meal.notes }}</div>
            }
          </button>
        }
      </div>
    }
    <button
      (click)="close()"
      type="button"
      class="mt-md w-full rounded-xl border border-outline-variant py-3 text-label-lg"
    >
      {{ i18n.t('cancel') }}
    </button>
  </div>
</div>
