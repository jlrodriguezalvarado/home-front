<div class="fixed inset-0 bg-black/50 flex items-center justify-center p-md z-50" (click)="close()">
  <div class="bg-surface-container-lowest w-full max-w-lg p-xl rounded-[24px] border border-outline-variant shadow-card-hover max-h-[90vh] overflow-y-auto" (click)="$event.stopPropagation()">
    <h2 class="text-title-lg text-on-surface mb-lg">{{ i18n.t('copyFavoriteDay') }}</h2>
    <app-loading-state *ngIf="loading()"></app-loading-state>
    <app-error-state *ngIf="error()" (retry)="load()"></app-error-state>
    <app-empty-state *ngIf="!loading() && !error() && days().length === 0" icon="favorite" [title]="i18n.t('favorites')"></app-empty-state>
    <div *ngIf="!loading() && !error() && days().length > 0" class="space-y-md">
      <div
        *ngFor="let day of days()"
        (click)="selectDay(day)"
        class="card-surface p-md cursor-pointer transition-shadow"
        [class.ring-2]="selectedDayId() === day.id"
        [class.ring-primary]="selectedDayId() === day.id">
        <div class="text-headline-md text-on-surface">{{ day.dayName || day.name }}</div>
        <div *ngIf="day.meals.length" class="mt-sm space-y-xs">
          <div *ngFor="let meal of day.meals" class="text-body-md text-on-surface-variant">
            {{ meal.mealType.name }} · {{ meal.recipe?.name || meal.name || meal.notes }}
          </div>
        </div>
      </div>
      <div class="space-y-sm">
        <label class="flex items-center gap-sm text-body-md text-on-surface cursor-pointer">
          <input type="radio" name="copyMode" [checked]="replaceExisting()" (change)="replaceExisting.set(true)">
          {{ i18n.t('replaceExistingMeals') }}
        </label>
        <label class="flex items-center gap-sm text-body-md text-on-surface cursor-pointer">
          <input type="radio" name="copyMode" [checked]="!replaceExisting()" (change)="replaceExisting.set(false)">
          {{ i18n.t('appendMeals') }}
        </label>
      </div>
      <div class="flex gap-md pt-md">
        <button (click)="close()" type="button" class="flex-1 py-3 border border-outline-variant rounded-xl text-label-lg">{{ i18n.t('cancel') }}</button>
        <button (click)="confirmCopy()" [disabled]="!selectedDayId()" type="button" class="flex-1 btn-primary py-3">{{ i18n.t('copyFavoriteDay') }}</button>
      </div>
    </div>
  </div>
</div>
