<div class="space-y-sm">
  <div class="flex items-start justify-between gap-md">
    <div class="min-w-0">
      <div class="text-label-sm text-primary uppercase tracking-wide">{{ meal.mealType.name }}</div>
      <h3 class="text-title-md text-on-surface mt-xs">{{ mealTitle() }}</h3>
      <p *ngIf="mealSubtitle()" class="text-body-sm text-on-surface-variant mt-xs">{{ mealSubtitle() }}</p>
    </div>
    <span *ngIf="meal.isFavorite" class="text-error shrink-0" [title]="i18n.t('favorite')">
      <span class="material-symbols-outlined text-[20px] material-symbols-filled">favorite</span>
    </span>
  </div>
  <p *ngIf="meal.notes && (meal.recipe || meal.name)" class="text-body-md text-on-surface-variant">{{ meal.notes }}</p>
  <ng-container *ngIf="meal.recipe as recipe">
    <img *ngIf="recipe.image" [src]="recipe.image" alt="" class="w-full max-h-48 object-cover rounded-xl">
    <video *ngIf="recipe.video" [src]="recipe.video" controls class="w-full max-h-64 rounded-xl"></video>
    <div *ngIf="recipe.description" class="rich-text-content" [innerHTML]="recipe.description"></div>
    <a
      *ngIf="recipeLink(recipe)"
      [href]="recipeLink(recipe)"
      target="_blank"
      rel="noopener noreferrer"
      class="text-primary text-label-md inline-flex items-center gap-1 hover:underline">
      <span class="material-symbols-outlined text-[16px]">open_in_new</span>
      {{ i18n.t('link') }}
    </a>
    <div *ngIf="sortedIngredients(recipe).length > 0" class="pt-sm border-t border-outline-variant">
      <div class="text-label-md text-on-surface-variant mb-sm">{{ i18n.t('ingredients') }}</div>
      <ul class="space-y-xs">
        <li *ngFor="let row of sortedIngredients(recipe)" class="text-body-md text-on-surface">
          <span class="tabular-nums">{{ ingredientLine(row) }}</span>
          <span *ngIf="row.product?.name" class="text-on-surface-variant"> · {{ row.product!.name }}</span>
          <span *ngIf="row.notes" class="text-body-sm text-on-surface-variant block">{{ row.notes }}</span>
        </li>
      </ul>
    </div>
  </ng-container>
  <ng-container *ngIf="!meal.recipe">
    <p *ngIf="meal.name && meal.notes && mealTitle() !== meal.notes" class="text-body-md text-on-surface-variant">{{ meal.notes }}</p>
  </ng-container>
</div>
