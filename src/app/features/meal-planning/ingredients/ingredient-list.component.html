<div class="space-y-lg">
  <app-meal-planning-nav></app-meal-planning-nav>
  <div class="flex flex-wrap items-center justify-between gap-md">
    <h1 class="page-title">{{ i18n.t('ingredients') }}</h1>
    <button (click)="openDialog()" class="btn-primary flex items-center gap-2">
      <span class="material-symbols-outlined text-[20px]">add</span>
      {{ i18n.t('newIngredient') }}
    </button>
  </div>
  <div class="flex flex-wrap gap-md">
    <input
      type="search"
      [ngModel]="searchQuery()"
      (ngModelChange)="onSearchChange($event)"
      [placeholder]="i18n.t('search')"
      class="input-outlined flex-1 min-w-[200px]">
    <select
      [ngModel]="activeFilter()"
      (ngModelChange)="onActiveFilterChange($event)"
      class="input-outlined">
      <option value="all">{{ i18n.t('all') }}</option>
      <option value="active">{{ i18n.t('active') }}</option>
      <option value="inactive">{{ i18n.t('inactive') }}</option>
    </select>
  </div>
  <app-loading-state *ngIf="loading() && filteredIngredients().length === 0"></app-loading-state>
  <app-error-state *ngIf="error()" (retry)="load()"></app-error-state>
  <app-empty-state
    *ngIf="!loading() && !error() && filteredIngredients().length === 0"
    icon="restaurant"
    [title]="i18n.t('ingredients')">
  </app-empty-state>
  <div *ngIf="!loading() && !error() && filteredIngredients().length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md">
    <div *ngFor="let item of filteredIngredients()" class="card-surface p-lg hover:shadow-card-hover transition-shadow">
      <div class="flex justify-between items-start gap-md">
        <div class="min-w-0">
          <div class="text-headline-md text-on-surface truncate">{{ item.name }}</div>
          <div *ngIf="item.description" class="text-body-md text-on-surface-variant mt-xs line-clamp-2">{{ item.description }}</div>
          <div class="text-body-md text-on-surface-variant mt-sm">
            <span class="text-label-lg">{{ i18n.t('defaultProduct') }}:</span>
            {{ item.defaultProduct?.name ?? '—' }}
          </div>
          <span
            class="inline-block mt-sm text-label-md px-sm py-xs rounded-lg"
            [class.bg-primary-container]="item.isActive"
            [class.text-on-primary-container]="item.isActive"
            [class.bg-surface-container]="!item.isActive"
            [class.text-on-surface-variant]="!item.isActive">
            {{ item.isActive ? i18n.t('active') : i18n.t('inactive') }}
          </span>
        </div>
        <div class="flex flex-col gap-sm shrink-0">
          <button (click)="openDialog(item)" class="text-primary text-label-md hover:underline flex items-center gap-1">
            <span class="material-symbols-outlined text-[18px]">edit</span>
            {{ i18n.t('edit') }}
          </button>
          <button (click)="deleteIngredient(item)" class="text-error text-label-md hover:underline flex items-center gap-1">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            {{ i18n.t('delete') }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="showDialog()" class="fixed inset-0 bg-black/50 flex items-center justify-center p-md z-50">
    <div class="bg-surface-container-lowest w-full max-w-md p-xl rounded-[24px] border border-outline-variant shadow-card-hover max-h-[90vh] flex flex-col overflow-hidden">
      <h2 class="text-title-lg text-on-surface mb-lg shrink-0">
        {{ editingId() ? i18n.t('editIngredient') : i18n.t('newIngredient') }}
      </h2>
      <div class="space-y-md overflow-y-auto min-h-0 flex-1" appDialogForm (dialogSubmit)="save()">
        <div>
          <label class="text-label-lg text-on-surface-variant block mb-xs">{{ i18n.t('name') }}</label>
          <input type="text" [ngModel]="form().name" (ngModelChange)="updateFormField('name', $event)" class="input-outlined">
        </div>
        <div>
          <label class="text-label-lg text-on-surface-variant block mb-xs">{{ i18n.t('description') }}</label>
          <textarea [ngModel]="form().description" (ngModelChange)="updateFormField('description', $event)" class="input-outlined min-h-[80px]"></textarea>
        </div>
        <div>
          <label class="text-label-lg text-on-surface-variant block mb-xs">{{ i18n.t('defaultProduct') }}</label>
          <div class="space-y-sm">
            <div>
              <label class="text-label-md text-on-surface-variant block mb-xs">{{ i18n.t('stores') }}</label>
              <select
                [ngModel]="selectedCommerceId()"
                (ngModelChange)="onCommerceChange($event)"
                class="input-outlined w-full">
                <option *ngIf="!commerces().length" [ngValue]="null">—</option>
                <option *ngFor="let c of commerces()" [ngValue]="c.id">{{ c.name }}</option>
              </select>
            </div>
            <div>
              <label class="text-label-md text-on-surface-variant block mb-xs">{{ i18n.t('products') }}</label>
              <app-search-select
                [options]="productOptions()"
                [value]="form().defaultProductId"
                [placeholder]="i18n.lang() === 'en' ? 'Select product' : 'Seleccionar producto'"
                [searchPlaceholder]="i18n.t('search')"
                [emptyLabel]="i18n.lang() === 'en' ? 'No products found' : 'Sin productos'"
                [loading]="productsLoading()"
                (valueChange)="onProductSelected($event)"
                (searchChange)="onProductSearchChange($event)">
              </app-search-select>
            </div>
          </div>
        </div>
        <label class="flex items-center gap-sm text-body-md text-on-surface">
          <input type="checkbox" [ngModel]="form().isActive" (ngModelChange)="updateFormField('isActive', $event)">
          {{ i18n.t('active') }}
        </label>
        <div class="flex gap-md pt-md">
          <button (click)="closeDialog()" type="button" class="flex-1 py-3 border border-outline-variant rounded-xl text-label-lg">{{ i18n.t('cancel') }}</button>
          <button (click)="save()" type="button" class="flex-1 btn-primary py-3">{{ i18n.t('save') }}</button>
        </div>
      </div>
    </div>
  </div>
</div>
