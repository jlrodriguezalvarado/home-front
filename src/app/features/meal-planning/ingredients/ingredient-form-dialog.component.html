<div
  class="fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-md"
  (click)="close()"
>
  <div
    class="flex max-h-[90vh] w-full max-w-md flex-col overflow-hidden rounded-[24px] border border-outline-variant bg-surface-container-lowest p-xl shadow-card-hover"
    (click)="$event.stopPropagation()"
  >
    <h2 class="mb-lg shrink-0 text-title-lg text-on-surface">
      {{ editingId() ? i18n.t('editIngredient') : i18n.t('newIngredient') }}
    </h2>
    <div class="min-h-0 flex-1 space-y-md overflow-y-auto" appDialogForm (dialogSubmit)="save()">
      <div>
        <label class="mb-xs block text-label-lg text-on-surface-variant">{{
          i18n.t('name')
        }}</label>
        <input
          type="text"
          [ngModel]="form().name"
          (ngModelChange)="updateFormField('name', $event)"
          class="input-outlined"
        />
      </div>
      <div>
        <label class="mb-xs block text-label-lg text-on-surface-variant">{{
          i18n.t('description')
        }}</label>
        <textarea
          [ngModel]="form().description"
          (ngModelChange)="updateFormField('description', $event)"
          class="input-outlined min-h-[80px]"
        ></textarea>
      </div>
      <div>
        <label class="mb-xs block text-label-lg text-on-surface-variant">{{
          i18n.t('defaultProduct')
        }}</label>
        <div class="space-y-sm">
          <div>
            <label class="mb-xs block text-label-md text-on-surface-variant">{{
              i18n.t('stores')
            }}</label>
            <select
              [ngModel]="selectedCommerceId()"
              (ngModelChange)="onCommerceChange($event)"
              class="input-outlined w-full"
            >
              @if (!commerces().length) {
                <option [ngValue]="null">—</option>
              }
              @for (c of commerces(); track c) {
                <option [ngValue]="c.id">{{ c.name }}</option>
              }
            </select>
          </div>
          <div>
            <label class="mb-xs block text-label-md text-on-surface-variant">{{
              i18n.t('products')
            }}</label>
            <app-search-select
              [options]="productOptions()"
              [value]="form().defaultProductId"
              [placeholder]="i18n.lang() === 'en' ? 'Select product' : 'Seleccionar producto'"
              [searchPlaceholder]="i18n.t('search')"
              [emptyLabel]="i18n.lang() === 'en' ? 'No products found' : 'Sin productos'"
              [loading]="productsLoading()"
              (valueChange)="onProductSelected($event)"
              (searchChange)="onProductSearchChange($event)"
            >
            </app-search-select>
          </div>
        </div>
      </div>
      <label class="flex items-center gap-sm text-body-md text-on-surface">
        <input
          type="checkbox"
          [ngModel]="form().isActive"
          (ngModelChange)="updateFormField('isActive', $event)"
        />
        {{ i18n.t('active') }}
      </label>
      <div class="flex gap-md pt-md">
        <button
          (click)="close()"
          type="button"
          class="flex-1 rounded-xl border border-outline-variant py-3 text-label-lg"
        >
          {{ i18n.t('cancel') }}
        </button>
        <button (click)="save()" type="button" class="btn-primary flex-1 py-3">
          {{ i18n.t('save') }}
        </button>
      </div>
    </div>
  </div>
</div>
